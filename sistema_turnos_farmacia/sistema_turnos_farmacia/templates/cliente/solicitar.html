<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitar Turno - Farmacia</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card-main { background: white; border-radius: 16px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-primary shadow-sm py-3 px-4">
        <div class="container-fluid">
            <span class="navbar-brand h1 mb-0"><i class="fa-solid fa-bullhorn me-2"></i> SISTEMA DE TURNOS - FARMACIA</span>
            <div class="d-flex align-items-center gap-3">
                <a href="/sala-espera" class="text-white text-decoration-none fw-semibold"><i class="fa-solid fa-tv me-1"></i> Sala de Espera</a>
                <a href="/solicitar" class="text-white text-decoration-none fw-bold bg-success px-3 py-1 rounded"><i class="fa-solid fa-circle-plus me-1"></i> Solicitar Turno</a>
                <a href="/admin" class="text-white text-decoration-none fw-semibold"><i class="fa-solid fa-user-nurse me-1"></i> Panel Farmacéutico</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card card-main p-5 text-center">
                    <h2 class="text-dark mb-2 fw-bold">Bienvenido a la Farmacia</h2>
                    <p class="text-muted mb-4">Seleccione su tipo de atención para obtener un turno:</p>

                    <div class="d-grid gap-4 col-10 mx-auto">
                        <button onclick="pedirTurno('general')" class="btn btn-primary btn-lg py-4 fw-bold fs-4 shadow-sm">
                            <i class="fa-solid fa-user me-2"></i> Turno General (G)
                        </button>
                        <button onclick="pedirTurno('prioritario')" class="btn btn-warning btn-lg py-4 fw-bold fs-4 shadow-sm text-dark">
                            <i class="fa-solid fa-star me-2"></i> Turno Prioritario (P)
                            <div class="fs-6 fw-normal text-muted mt-1">(Tercera Edad / Embarazadas / Discapacidad)</div>
                        </button>
                    </div>

                    <div id="resultado-ticket" class="mt-4" style="display:none;">
                        <div class="alert alert-success p-3">
                            <h4 class="alert-heading fw-bold">¡Turno Generado con Éxito!</h4>
                            <h1 class="display-3 fw-bold text-success my-2" id="lbl-numero-generado">G-1</h1>
                            <p class="mb-0">Por favor, acérquese a la sala de espera.</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        function pedirTurno(tipo) {
            fetch(`/crear-turno/${tipo}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('lbl-numero-generado').innerText = data.numero;
                        let panelRes = document.getElementById('resultado-ticket');
                        panelRes.style.display = 'block';
                        setTimeout(() => {
                            panelRes.style.display = 'none';
                        }, 5000);
                    } else {
                        alert("No se pudo generar el turno: " + (data.message || "Error desconocido"));
                    }
                })
                .catch(err => {
                    console.error("Error de red:", err);
                    alert("Error de conexión con el servidor Flask.");
                });
        }
    </script>
</body>
</html>
