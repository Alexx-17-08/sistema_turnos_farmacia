<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Turnos - Farmacia</title>
    
    <!-- Ícono de la pestaña recuperado -->
    <link rel="icon" href="{{ url_for('static', filename='img/icono.png') }}" type="image/png">
    
    <!-- Bootstrap para los estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu archivo CSS personalizado (mantiene tu diseño original si lo tienes) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        .navbar-custom {
            background-color: #0d6efd; /* Azul de tu header */
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white;
            font-weight: 500;
        }
        .navbar-custom .nav-link:hover {
            color: #f8f9fa;
        }
        .btn-farmaceutico {
            background-color: #198754; /* Verde */
            color: white !important;
            border-radius: 5px;
            padding: 5px 15px;
        }
        .btn-farmaceutico:hover {
            background-color: #157347;
        }
    </style>
</head>
<body class="bg-light">

    <!-- HEADER AZUL / BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm">
        <div class="container-fluid">
            <!-- Título / Logo -->
            <a class="navbar-brand" href="/">
                📢 SISTEMA DE TURNOS - FARMACIA
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <!-- RUTAS LIMPIAS CORREGIDAS -->
                    <li class="nav-item me-3">
                        <a class="nav-link" href="/">📺 Sala de Espera</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" href="/solicitar">🔴 Solicitar Turno</a>
                    </li>
                    <li class="nav-item d-flex align-items-center">
                        {% if session.get('logeado') %}
                            <a class="nav-link btn-farmaceutico me-2" href="/admin">🩺 Volver al Panel</a>
                            <a class="nav-link text-white" href="/logout" style="text-decoration: underline; font-size: 0.9em;">Cerrar sesión</a>
                        {% else %}
                            <a class="nav-link btn-farmaceutico" href="/admin">🩺 Panel Farmacéutico</a>
                        {% endif %}
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ESPACIO PARA EL CONTENIDO DE LAS DEMÁS PÁGINAS -->
    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Scripts de Bootstrap y SocketIO para el tiempo real -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    
    <!-- Bloque para scripts específicos -->
    {% block scripts %}
    {% endblock %}
    
</body>
</html>
