<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Farmacéutico - Sistema de Turnos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card-main { background: white; border-radius: 16px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-primary shadow-sm py-3 px-4">
        <div class="container-fluid">
            <span class="navbar-brand h1 mb-0"><i class="fa-solid fa-bullhorn me-2"></i> SISTEMA DE TURNOS - FARMACIA</span>
            <div class="d-flex align-items-center gap-3">
                <a href="/sala-espera" class="text-white text-decoration-none fw-semibold"><i class="fa-solid fa-tv me-1"></i> Sala de Espera</a>
                <a href="/solicitar" class="text-white text-decoration-none fw-semibold"><i class="fa-solid fa-circle-plus me-1"></i> Solicitar Turno</a>
                <a href="/admin" class="text-white text-decoration-none fw-bold bg-success px-3 py-1 rounded"><i class="fa-solid fa-user-nurse me-1"></i> Panel Farmacéutico</a>
                <a href="/admin/logout" class="text-white text-decoration-none fw-semibold btn btn-outline-light btn-sm ms-2"><i class="fa-solid fa-right-from-bracket me-1"></i> Cerrar sesión</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-main p-4 text-center">
                    
                    <div class="d-flex justify-content-center align-items-center gap-3 mb-4">
                        <label for="select-caja" class="fw-bold fs-5 text-secondary">Seleccione su Caja de Atención:</label>
                        <select id="select-caja" class="form-select w-auto fw-bold text-primary fs-5" onchange="cambiarCajaSeleccionada()">
                            <option value="1">Caja 1</option>
                            <option value="2">Caja 2</option>
                            <option value="3">Caja 3</option>
                            <option value="4">Caja 4</option>
                            <option value="5">Caja 5</option>
                            <option value="6">Caja 6</option>
                        </select>
                    </div>

                    <hr class="text-muted">

                    <h5 class="text-muted mt-3">Atendiendo Actualmente:</h5>
                    <h1 class="display-2 fw-bold text-primary my-3" id="turno-actual-caja">Ninguno</h1>
                    <p class="text-muted fs-6 mb-4">Pacientes en Espera (Global): <span id="contador-espera-global" class="fw-bold text-dark">0</span></p>

                    <div class="d-grid gap-3 col-10 mx-auto mt-2">
                        <button onclick="llamarSiguiente()" class="btn btn-primary btn-lg py-3 fw-bold shadow-sm">
                            <i class="fa-solid fa-bell me-2"></i> Llamar Siguiente Turno
                        </button>
                        <div class="row g-2">
                            <div class="col-6">
                                <button onclick="finalizarTurno()" class="btn btn-success btn-lg py-3 fw-bold w-100 shadow-sm">
                                    <i class="fa-solid fa-check me-2"></i> Finalizar / Atendido
                                </button>
                            </div>
                            <div class="col-6">
                                <button onclick="marcarAusente()" class="btn btn-danger btn-lg py-3 fw-bold w-100 shadow-sm">
                                    <i class="fa-solid fa-xmark me-2"></i> Marcar Ausente
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button onclick="reiniciarTurnosDia()" class="btn btn-outline-secondary btn-sm">
                            <i class="fa-solid fa-rotate-right me-1"></i> Reiniciar Conteo Diario
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let cajaGuardada = localStorage.getItem('caja_activa_farmacia') || "1";
            document.getElementById('select-caja').value = cajaGuardada;
            sincronizarPanel();
            setInterval(sincronizarPanel, 2000);
        });

        function cambiarCajaSeleccionada() {
            let cajaVal = document.getElementById('select-caja').value;
            localStorage.setItem('caja_activa_farmacia', cajaVal);
            sincronizarPanel();
        }

        function obtenerCajaActual() {
            return document.getElementById('select-caja').value;
        }

        function llamarSiguiente() {
            let cajaId = obtenerCajaActual();
            fetch(`/llamar-siguiente/${cajaId}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        sincronizarPanel();
                    } else {
                        alert(data.message || "No hay turnos pendientes en este momento.");
                    }
                });
        }

        function finalizarTurno() {
            let cajaId = obtenerCajaActual();
            fetch(`/finalizar-turno/${cajaId}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => sincronizarPanel());
        }

        function marcarAusente() {
            let cajaId = obtenerCajaActual();
            fetch(`/marcar-ausente/${cajaId}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => sincronizarPanel());
        }

        function reiniciarTurnosDia() {
            if (confirm("¿Desea reiniciar todos los turnos del día?")) {
                fetch('/reiniciar-turnos', { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        alert("Turnos reiniciados.");
                        sincronizarPanel();
                    });
            }
        }

        function sincronizarPanel() {
            let cajaActivaNum = obtenerCajaActual();
            fetch('/api/estado-actual')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('contador-espera-global').innerText = data.pacientes_en_espera;

                    let turnoEnAtencion = "Ninguno";
                    if (data.cajas_llamando) {
                        data.cajas_llamando.forEach(item => {
                            if (item.caja === `Caja ${cajaActivaNum}`) {
                                turnoEnAtencion = item.numero;
                            }
                        });
                    }
                    document.getElementById('turno-actual-caja').innerText = turnoEnAtencion;
                });
        }
    </script>
</body>
</html>
