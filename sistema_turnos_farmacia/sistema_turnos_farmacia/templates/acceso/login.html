<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Panel Farmacéutico</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card-main { background: white; border-radius: 16px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-primary shadow-sm py-3 px-4">
        <div class="container-fluid">
            <span class="navbar-brand h1 mb-0"><i class="fa-solid fa-bullhorn me-2"></i> SISTEMA DE TURNOS - FARMACIA</span>
            <div class="d-flex align-items-center gap-3">
                <a href="/sala-espera" class="text-white text-decoration-none fw-semibold"><i class="fa-solid fa-tv me-1"></i> Sala de Espera</a>
                <a href="/solicitar" class="text-white text-decoration-none fw-semibold"><i class="fa-solid fa-circle-plus me-1"></i> Solicitar Turno</a>
                <a href="/admin" class="text-white text-decoration-none fw-bold bg-success px-3 py-1 rounded"><i class="fa-solid fa-user-nurse me-1"></i> Panel Farmacéutico</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-main p-4 text-center">
                    <h3 class="text-primary mb-3"><i class="fa-solid fa-lock me-2"></i> Iniciar Sesión</h3>
                    <p class="text-muted mb-4">Ingrese sus credenciales de farmacéutico</p>

                    {% if error %}
                        <div class="alert alert-danger py-2">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="/admin" class="text-start">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Usuario</label>
                            <input type="text" name="usuario" class="form-control" placeholder="Ingrese su usuario" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Contraseña</label>
                            <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary py-2 fw-bold">Entrar al Panel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
